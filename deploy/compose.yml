# Personal project (not Aerostacks). Deploy: yastrab1/opravovna scripts/deploy.mjs
name: opravovna

services:
  opravovna:
    image: ghcr.io/yastrab1/opravovna@sha256:<pinned-by-deploy>
    restart: unless-stopped
    init: true
    user: "1000:1000"
    env_file:
      - ./secrets/opravovna.env
    environment:
      APP_ORIGIN: https://opravovna.tech
      DATA_DIR: /data
      EXPORT_WORKERS: "12"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8791:8787"
    networks:
      - opravovna
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  opravovna-tunnel:
    image: cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    depends_on:
      opravovna:
        condition: service_healthy
    volumes:
      - ./secrets/tunnel:/etc/cloudflared:ro
    networks:
      - opravovna
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  opravovna:
